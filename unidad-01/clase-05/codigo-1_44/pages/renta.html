<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CineUPS — Renta de Películas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="mb-3">Renta de Películas</h1>

      <form id="form-renta" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nombre completo</label>
          <input type="text" id="nombre" class="form-control" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Correo electrónico</label>
          <input type="email" id="correo" class="form-control" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Cédula / Identificación</label>
          <input type="text" id="cedula" class="form-control" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Teléfono</label>
          <input type="tel" id="telefono" class="form-control" required />
        </div>
        <div class="col-12">
          <label class="form-label">Dirección</label>
          <input type="text" id="direccion" class="form-control" required />
        </div>

        <div class="col-12">
          <label class="form-label">Películas (selección múltiple)</label>
          <select id="peliculas" class="form-select" multiple required></select>
          <div class="form-text">Mantén Ctrl/⌘ para seleccionar varias.</div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Días de renta</label>
          <select id="dias" class="form-select" required>
            <option value="1">1 día</option>
            <option value="2">2 días</option>
            <option value="3">3 días</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Forma de pago</label>
          <select id="pago" class="form-select" required>
            <option value="transferencia">Transferencia bancaria</option>
            <option value="efectivo">Efectivo</option>
          </select>
        </div>

        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Confirmar renta</button>
          <a href="../index.html" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </main>

    <div class="modal fade" id="modalResumen" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Resumen de la renta</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <div id="resumen-cliente" class="mb-3"></div>
            <div id="resumen-peliculas" class="mb-3"></div>
            <div id="resumen-dias" class="mb-2"></div>
            <div id="resumen-pago" class="mb-2"></div>
            <hr />
            <div id="resumen-total" class="fs-5 fw-semibold"></div>
            <div class="mt-3 text-muted">
              Renta completada con éxito. Tu experiencia Salesiana de cine te
              espera.
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" data-bs-dismiss="modal">
              Aceptar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/renta.js"></script>
  </body>
</html>

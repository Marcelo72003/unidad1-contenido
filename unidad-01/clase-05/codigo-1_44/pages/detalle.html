<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CineUPS — Detalle de Película</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="detalle-pelicula" class="container py-5">
      <div class="text-center mb-4">
        <h2 id="titulo" class="mb-1"></h2>
        <div class="text-muted mb-3">Selección de Marcelo</div>
        <div id="estado-precio" class="mb-3"></div>

        <div class="alert alert-info" role="alert">
          Consulte el tráiler oficial y la información detallada de la película.
        </div>
        <div class="ratio ratio-16x9 mb-4">
          <iframe id="trailer" src="" allowfullscreen></iframe>
        </div>
      </div>

      <div class="card mb-4">
        <div class="row g-0">
          <div class="col-md-4">
            <img
              id="poster"
              src=""
              class="img-fluid rounded-start"
              alt="Póster de la película"
            />
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title">Sinopsis</h5>
              <p id="sinopsis" class="card-text"></p>
              <span id="generos" class="badge bg-secondary"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Reseñas</h5>
          <div id="resumen-resenas" class="small text-muted mb-2"></div>
          <div id="lista-resenas" class="list-group"></div>
        </div>
      </div>

      <div class="text-center">
        <a href="../index.html" class="btn btn-secondary">Volver al inicio</a>
      </div>
      <div class="text-center">
        <a href="../index.html" class="btn btn-secondary">Volver al inicio</a>
        <a id="btn-reservar" href="renta.html" class="btn btn-success ms-2"
          >Reservar</a
        >
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="../js/detalle.js"></script>
  </body>
</html>
